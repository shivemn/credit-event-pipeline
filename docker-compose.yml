services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: ccp-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  # PostgreSQL: the permanent history of every event. Kafka is the live stream, Ignite the fast copy of each
  # credit file, and this is the record you can always rebuild them from. Host port 5433 avoids clashing with a
  # PostgreSQL you may already have on 5432. Local demo password only.
  postgres:
    image: postgres:16-alpine
    container_name: ccp-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ccp
      POSTGRES_USER: ccp
      POSTGRES_PASSWORD: ccp
    volumes:
      - ccp-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ccp -d ccp"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Prometheus: collects the app's metrics every 5 seconds and stores them as time series.
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: ccp-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Grafana: draws dashboards from Prometheus. Open http://localhost:3000
  grafana:
    image: grafana/grafana:11.2.2
    container_name: ccp-grafana
    ports:
      - "3000:3000"
    environment:
      # Local demo only: no login needed. Never do this on a shared server.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  ccp-pgdata:
